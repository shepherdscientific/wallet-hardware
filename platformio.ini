; CoinCube Hardware Wallet — ESP32-S3 PlatformIO Build Configuration
; Build: pio run -e dev         (WiFi OTA enabled, ATECC608B I2C)
; Build: pio run -e devsim      (WiFi OTA, SE stub backed by NVS — no ATECC needed)
; Build: pio run -e production  (WiFi disabled, ATECC608B I2C)
; Build: pio run -e ternarycore (DEV_BUILD, TernaryCore FPGA UART)
; Build: pio run -e nxpse       (DEV_BUILD, NXP SE051 I2C — optional, not available)
;
; Production builds enable secure boot v2 + flash encryption via sdkconfig.
; Run scripts/gen_sdkconfig.sh to generate sdkconfig.production before building.
; Dev builds use default sdkconfig (no secure boot required).
;
; CI : pio run -e dev -e production

[platformio]
default_envs = dev, production, ternarycore, nxpse
; Use devsim for day-to-day hardware testing when no provisioned ATECC is
; available — the SE stub stores all key material in ESP32 NVS so the wallet
; persists across reboots exactly like a real SE would.
src_dir = .

[common]
extra_scripts = scripts/post_build.py

[env:dev]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

build_src_filter = +<*> -<test_*.cpp>

monitor_speed = 115200

build_flags =
    -DDEV_BUILD
    -DUSE_ATECC608B
    -DCORE_DEBUG_LEVEL=0
    -DSKIP_INTEGRITY_CHECK

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11
    adafruit/Adafruit SSD1306 @ ^2.5

board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

[env:devsim]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

build_src_filter = +<*> -<test_*.cpp>

monitor_speed = 115200

build_flags =
    -DDEV_BUILD
    -DUSE_SE_STUB
    -DUSE_NVS_PERSIST
    -DCORE_DEBUG_LEVEL=0
    -DSKIP_INTEGRITY_CHECK

lib_extra_dirs = .pio/libdeps/dev

board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

[env:production]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

build_src_filter = +<*> -<test_*.cpp>

monitor_speed = 115200

build_flags =
    -DPRODUCTION_BUILD
    -DUSE_ATECC608B
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11
    adafruit/Adafruit SSD1306 @ ^2.5

board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

extra_scripts = ${common.extra_scripts}

[env:ternarycore]
; TernaryCore SE build — ESP32-S3 + Tang Nano 9K FPGA over UART.
; Wiring (confirmed bench configuration):
;   ESP32-S3 GPIO17 (TX) → Tang Nano header pin 39 (uart_ext_rx)
;   ESP32-S3 GPIO16 (RX) ← Tang Nano header pin 38 (uart_ext_tx)
;   GND shared (3.3V logic, no level shifting needed)
; Flash Tang Nano to Embedded Flash (not SRAM) for reliable cold-boot.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

build_src_filter = +<*> -<test_*.cpp>

monitor_speed = 115200

build_flags =
    -DDEV_BUILD
    -DUSE_TERNARYCORE_SE
    -DTC_SE_UART_TX_PIN=17   ; ESP32-S3 GPIO17 → TernaryCore UART_RX (header pin 39)
    -DTC_SE_UART_RX_PIN=16   ; ESP32-S3 GPIO16 ← TernaryCore UART_TX (header pin 38)
    -DCORE_DEBUG_LEVEL=0
    -DSKIP_INTEGRITY_CHECK

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11
    adafruit/Adafruit SSD1306 @ ^2.5

board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

[env:nxpse]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

build_src_filter = +<*> -<test_*.cpp>

monitor_speed = 115200

build_flags =
    -DDEV_BUILD
    -DUSE_SE051
    -DCORE_DEBUG_LEVEL=0
    -DSKIP_INTEGRITY_CHECK

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11
    adafruit/Adafruit SSD1306 @ ^2.5

board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
