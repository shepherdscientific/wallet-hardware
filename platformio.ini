; CoinCube Hardware Wallet — ESP32-S3 PlatformIO Build Configuration
; Build: pio run -e dev         (WiFi OTA enabled, ATECC608B I2C)
; Build: pio run -e production  (WiFi disabled, ATECC608B I2C)
; Build: pio run -e ternarycore (DEV_BUILD, TernaryCore FPGA UART)
; Build: pio run -e nxpse       (DEV_BUILD, NXP SE051 I2C — optional, not available)
;
; Production builds enable secure boot v2 + flash encryption via sdkconfig.
; Run scripts/gen_sdkconfig.sh to generate sdkconfig.production before building.
; Dev builds use default sdkconfig (no secure boot required).
;
; CI : pio run -e dev -e production

[platformio]
default_envs = dev, production, ternarycore, nxpse
src_dir = .

[common]
extra_scripts = scripts/post_build.py

[env:dev]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

build_src_filter = +<*> -<test_*.cpp>

monitor_speed = 115200

build_flags =
    -DDEV_BUILD
    -DUSE_ATECC608B
    -DCORE_DEBUG_LEVEL=0
    -DSKIP_INTEGRITY_CHECK  ; hash was provisioned against old firmware binary — re-provision after stable build

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11
    adafruit/Adafruit SSD1306 @ ^2.5

board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; post_build.py disabled for dev: it patches the binary which invalidates the
; bootloader's appended SHA-256 (not app_elf_sha256 — see production note).
; Re-enable once build hash injection is moved to a compile-time -D flag.

[env:production]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

build_src_filter = +<*> -<test_*.cpp>

monitor_speed = 115200

build_flags =
    -DPRODUCTION_BUILD
    -DUSE_ATECC608B
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11
    adafruit/Adafruit SSD1306 @ ^2.5

board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; post_build.py: patches binary with short build hash.  Known issue: updates
; app_elf_sha256 in esp_app_desc_t but the bootloader checks the SHA-256
; appended at the end of the image by esptool — causing rst:0x3 boot loop.
; Accepted for production until build hash moves to a compile-time -D flag.
extra_scripts = ${common.extra_scripts}

; CI assertion: production binary must be < 1.2 MB (WiFi stack excluded).
; Run: pio run -e production && stat -f%z .pio/build/production/firmware.bin

[env:ternarycore]
; Build for CoinCube wallet wired to TernaryCore SE (Tang Nano 9K FPGA) over UART.
; Connect: ESP32-S3 GPIO16 (TX) → Tang header pin 39 (UART_RX)
;          ESP32-S3 GPIO17 (RX) ← Tang header pin 38 (UART_TX)
;          GND shared
; Override TX/RX pins via build_flags if your wiring differs.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

build_src_filter = +<*> -<test_*.cpp>

monitor_speed = 115200

build_flags =
    -DDEV_BUILD
    -DUSE_TERNARYCORE_SE
    -DTC_SE_UART_TX_PIN=16   ; ESP32-S3 GPIO16 → TernaryCore UART_RX (header pin 39)
    -DTC_SE_UART_RX_PIN=17   ; ESP32-S3 GPIO17 ← TernaryCore UART_TX (header pin 38)
    -DCORE_DEBUG_LEVEL=0
    -DSKIP_INTEGRITY_CHECK

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11
    adafruit/Adafruit SSD1306 @ ^2.5

board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; post_build.py disabled for ternarycore (same reason as dev above).

[env:nxpse]
; Optional build target for NXP SE051C2 Secure Element over I2C.
; Not currently available — provided for future hardware variant.
; I2C: SDA=GPIO8, SCL=GPIO9, addr 0x48
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

build_src_filter = +<*> -<test_*.cpp>

monitor_speed = 115200

build_flags =
    -DDEV_BUILD
    -DUSE_SE051
    -DCORE_DEBUG_LEVEL=0
    -DSKIP_INTEGRITY_CHECK

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11
    adafruit/Adafruit SSD1306 @ ^2.5

board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; Post-build scripts disabled (same reason as dev above).
