; CoinCube Hardware Wallet — ESP32-S3 PlatformIO Build Configuration
; Build: pio run -e dev        (WiFi OTA enabled)
; Build: pio run -e production (WiFi disabled, radio off)
;
; Production builds enable secure boot v2 + flash encryption via sdkconfig.
; Run scripts/gen_sdkconfig.sh to generate sdkconfig.production before building.
; Dev builds use default sdkconfig (no secure boot required).
;
; CI : pio run -e dev -e production

[platformio]
default_envs = dev, production
src_dir = .

[common]
extra_scripts = scripts/post_build.py

[env:dev]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

build_src_filter = +<*> -<test_*.cpp>

monitor_speed = 115200

build_flags =
    -DDEV_BUILD
    -DUSE_ATECC608B
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11
    adafruit/Adafruit SSD1306 @ ^2.5

board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

extra_scripts = ${common.extra_scripts}

[env:production]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

build_src_filter = +<*> -<test_*.cpp>

monitor_speed = 115200

build_flags =
    -DPRODUCTION_BUILD
    -DUSE_ATECC608B
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11
    adafruit/Adafruit SSD1306 @ ^2.5

board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

extra_scripts = ${common.extra_scripts}

; CI assertion: production binary must be < 1.2 MB (WiFi stack excluded).
; Run: pio run -e production && stat -f%z .pio/build/production/firmware.bin
